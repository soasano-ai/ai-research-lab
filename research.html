<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究ワーク | AI Research Lab</title><style>:root{font-family:system-ui,-apple-system,sans-serif;background:#0c1728;color:#eff6ff}*{box-sizing:border-box}main{max-width:780px;margin:auto;padding:18px}a{color:#9ce4d2}p{line-height:1.8;color:#c1d3e4}.box{background:#162b43;border:1px solid #3d5871;border-radius:14px;padding:17px;margin:15px 0}label{display:block;font-weight:700;margin-bottom:8px}textarea{width:100%;min-height:90px;background:#0b1b30;border:1px solid #667c91;border-radius:9px;color:#fff;padding:10px;font:inherit}button{background:#7adfc9;border:0;border-radius:9px;padding:12px 16px;font-weight:750;cursor:pointer}</style></head><body><main><a href="./index.html">← 学習ホーム</a><h1>研究計画を作ろう</h1><p>研究は「なんとなく試す」だけでは成立しません。問い・予想・比較条件・測定方法・限界を書いてから実験します。</p><div id="fields"></div><button id="download">Obsidian用Markdownを書き出す</button><p>ノートはこの端末に保存されます。社内資料や機密情報を入力しないでください。</p></main><script>const fields=[["question","問い：何を明らかにする？","例：AIへの曖昧な指示はコード修正失敗を増やすか"],["hypothesis","仮説：どんな結果を予想する？","例：具体的な条件を示すと不要変更率が下がる"],["conditions","比較条件：何を揃え、何を変える？","例：同じ課題で指示文だけ変更"],["metrics","評価指標：何を測る？","例：テスト成功率、不要変更率、処理時間"],["limitations","限界・安全面：何に注意する？","例：試行回数が少ない、秘密情報を使わない"]];const key='ai-research-plan-v3';let notes={};try{notes=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){}const box=document.getElementById('fields');for(const [id,label,example] of fields){const div=document.createElement('section');div.className='box';const title=document.createElement('label');title.textContent=label;title.htmlFor=id;const area=document.createElement('textarea');area.id=id;area.placeholder=example;area.value=notes[id]||'';area.oninput=()=>{notes[id]=area.value;try{localStorage.setItem(key,JSON.stringify(notes))}catch(e){}};div.append(title,area);box.append(div)}document.getElementById('download').onclick=()=>{const md=['---','tags: [ai-research, research-plan]','---','# 研究計画',...fields.flatMap(([id,label])=>['','## '+label,notes[id]||'未記入'])].join('\n');const url=URL.createObjectURL(new Blob([md],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='研究計画.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}</script><script src="./version.js?v=3.1.0"></script></body></html>
