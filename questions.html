<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>質問ノート | AI Research Lab</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#edf5ff;background:#0b1729}*{box-sizing:border-box}body{margin:0}main{max-width:950px;padding:20px;margin:auto}a{color:#95e2d2}h1{font-size:clamp(27px,5vw,38px)}p{line-height:1.75;color:#c2d2e3}.panel{padding:20px;border:1px solid #39536c;border-radius:16px;background:#15283e;margin:18px 0}label{display:block;margin:13px 0 6px;font-weight:750}textarea,input,select{width:100%;background:#0c1b30;color:white;border:1px solid #647c94;border-radius:10px;font:inherit;padding:12px}textarea{min-height:85px;resize:vertical}button{background:#64d5bd;color:#092632;border:0;padding:12px 16px;border-radius:10px;font:750 14px system-ui;cursor:pointer}button.secondary{background:#264058;color:white;border:1px solid #67849c}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.entry{background:#0f2034;padding:14px;border-radius:12px;border:1px solid #3b526a;margin:10px 0}.entry h3{margin:7px 0}.entry p{white-space:pre-wrap;margin:8px 0;overflow-wrap:anywhere}.entry small{color:#a8bfd4}.muted{color:#a9bdd3;font-size:13px}.empty{border:1px dashed #65849e;padding:14px;border-radius:10px}.pill{display:inline-block;background:#244c55;padding:4px 9px;border-radius:20px;font-size:12px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ffdc82;outline-offset:2px}@media(max-width:600px){main{padding:12px}.panel{padding:15px}.row{display:block}.row>*{margin-bottom:8px;width:100%}}
</style></head><body><main><a href="./index.html">← 学習ホーム</a><h1>質問ノート</h1><p>「分からない」を研究者への材料にする場所。質問を書き、調べた答えを記録し、解決したか管理できます。内容は自動的にAIへ送られません。</p><section class="panel"><h2>質問を追加・編集</h2><form id="form"><input type="hidden" id="editid"><label for="question">何が分からない？（必須）</label><textarea id="question" required maxlength="2000" placeholder="例：AIの学習と推論はどう違うの？"></textarea><label for="context">どこで疑問に思った？</label><input id="context" maxlength="300" placeholder="例：体系コース『学習と推論』"><label for="answer">調べた答え・自分の理解</label><textarea id="answer" maxlength="8000" placeholder="分かっていなければ空欄でOK"></textarea><label for="source">参考URL（任意）</label><input type="url" id="source" placeholder="https://..."><label for="status">状態</label><select id="status"><option value="open">未解決</option><option value="review">確認中</option><option value="resolved">解決</option></select><p class="row"><button type="submit">質問を保存</button><button type="button" class="secondary" id="clear">入力をクリア</button></p></form><p id="message" role="status" class="muted"></p></section><section class="panel"><h2>保存した質問 <span id="count" class="pill">0</span></h2><div class="row"><input type="search" id="search" aria-label="質問検索" placeholder="質問・答えを検索"><select id="filter" aria-label="状態で絞り込み"><option value="all">すべて</option><option value="open">未解決</option><option value="review">確認中</option><option value="resolved">解決</option></select></div><div id="list"></div><div class="row"><button class="secondary" id="export" type="button">全質問をObsidian用.mdで保存</button><button class="secondary" id="backup" type="button">JSONバックアップ</button><label class="secondary" style="padding:10px;border-radius:8px">復元JSON<input id="import" type="file" accept="application/json" style="margin-top:7px"></label></div></section><p class="muted">質問はこの端末のブラウザに保存。別のスマホ・PCへ自動同期はしません。公開リポジトリや他人と共有するファイルに個人情報・会社情報を含めないでください。</p></main><script>
const KEY='ai-research-questions-v1';let data=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))data=v}catch(e){}
const $=id=>document.getElementById(id);const statuses={open:'未解決',review:'確認中',resolved:'解決'};function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){$('message').textContent='保存に失敗しました。ストレージの空き容量をご確認ください。';return false}}
function clear(){['editid','question','context','answer','source'].forEach(k=>$(k).value='');$('status').value='open'}$('clear').onclick=clear;
$('form').onsubmit=e=>{e.preventDefault();const q=$('question').value.trim();if(!q)return;const id=$('editid').value||String(Date.now())+'-'+Math.random().toString(36).slice(2,8);const old=data.find(x=>x.id===id);const v={id,question:q,context:$('context').value.trim(),answer:$('answer').value.trim(),source:$('source').value.trim(),status:$('status').value,created:old?.created||new Date().toISOString(),updated:new Date().toISOString()};if(old)Object.assign(old,v);else data.unshift(v);if(persist()){clear();$('message').textContent='保存しました。'}render()};
$('search').oninput=render;$('filter').onchange=render;
function edit(id){const d=data.find(x=>x.id===id);if(!d)return;['id','question','context','answer','source','status'].forEach(k=>$(k==='id'?'editid':k).value=d[k]||'');window.scrollTo({top:0,behavior:'smooth'});$('question').focus()}
function remove(id){if(!confirm('この質問を削除しますか？'))return;data=data.filter(x=>x.id!==id);persist();render()}
function safeLink(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:null}catch(e){return null}}
function render(){const out=$('list');out.replaceChildren();const q=$('search').value.trim().toLowerCase(),filter=$('filter').value;let items=data.filter(x=>(filter==='all'||x.status===filter)&&[x.question,x.answer,x.context].join(' ').toLowerCase().includes(q));$('count').textContent=items.length+' / '+data.length;if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent='該当する質問がありません。上の入力欄から追加しましょう。';out.append(p)}items.forEach(x=>{const el=document.createElement('article');el.className='entry';const small=document.createElement('small');small.textContent=statuses[x.status]+' · '+new Date(x.updated).toLocaleDateString('ja-JP');const h=document.createElement('h3');h.textContent=x.question;el.append(small,h);if(x.context){let p=document.createElement('p');p.textContent='きっかけ：'+x.context;el.append(p)}if(x.answer){let p=document.createElement('p');p.textContent='答え・メモ：'+x.answer;el.append(p)}const href=safeLink(x.source);if(href){const a=document.createElement('a');a.href=href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='参考リンクを開く';el.append(a)}const row=document.createElement('p');row.className='row';const b=document.createElement('button');b.className='secondary';b.textContent='編集';b.onclick=()=>edit(x.id);const del=document.createElement('button');del.className='secondary';del.textContent='削除';del.onclick=()=>remove(x.id);row.append(b,del);el.append(row);out.append(el)})}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function plain(s){return String(s||'').replaceAll('\\','\\\\').replaceAll(']','\\]').replaceAll('[','\\[')}
$('export').onclick=()=>{const lines=['---','tags: [ai-research, questions]','---','# AI研究ラボ 質問ノート','','エクスポート日: '+new Date().toLocaleDateString('ja-JP'),''];data.forEach((x,i)=>{lines.push('## Q'+(i+1)+': '+plain(x.question),'','- 状態: '+statuses[x.status],'- 更新: '+new Date(x.updated).toLocaleDateString('ja-JP'),'- きっかけ: '+plain(x.context),'- 参考: '+(safeLink(x.source)||'未記入'),'','### 答え・調査メモ',plain(x.answer)||'未解決','','---','')});download('AI研究ラボ_質問ノート.md',lines.join('\n'),'text/markdown;charset=utf-8')};
$('backup').onclick=()=>download('AI研究ラボ_質問バックアップ.json',JSON.stringify(data,null,2),'application/json');
$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!Array.isArray(parsed)||!parsed.every(x=>x&&typeof x.id==='string'&&typeof x.question==='string'&&typeof x.status==='string'))throw Error();if(confirm('現在の質問データをバックアップの内容で置き換えますか？')){data=parsed.map(x=>({id:x.id,question:x.question,context:String(x.context||''),answer:String(x.answer||''),source:String(x.source||''),status:statuses[x.status]?x.status:'open',created:x.created||new Date().toISOString(),updated:x.updated||new Date().toISOString()}));persist();render()}}catch(e){alert('正しい質問バックアップではありません')}e.target.value=''};render();
</script><script src="./navigation.js?v=3.5.0"></script><script src="./version.js?v=3.5.0"></script><script src="./ai-chat.js?v=3.5.0"></script></body></html>
