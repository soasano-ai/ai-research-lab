<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>体系的に学ぶ | AI研究ラボ</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#eaf3ff;background:#091322}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}a{color:#8edaff}main{max-width:1100px;margin:auto;padding:20px}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.hero{background:linear-gradient(125deg,#15344b,#132044);padding:24px;border:1px solid #38516e;border-radius:18px;margin:20px 0}.muted{color:#b0c2d6}h1{font-size:clamp(25px,5vw,40px)}.layout{display:grid;grid-template-columns:300px 1fr;gap:16px}.card{background:#101f32;border:1px solid #30455c;border-radius:16px;padding:20px}.item{display:block;background:#172b41;color:#eaf3ff;border:1px solid #39536e;border-radius:10px;padding:11px;margin:8px 0;width:100%;text-align:left}.item.active{border-color:#77d4c5;background:#1e3e50}.tag{color:#9fe0d3;font-size:12px}.choice{width:100%;text-align:left;padding:12px;margin:7px 0;background:#1a3046;color:white;border:1px solid #44647d;border-radius:9px}.choice:focus-visible,.item:focus-visible,button:focus-visible{outline:3px solid #ffda76;outline-offset:3px}.primary{border:0;border-radius:10px;padding:12px 18px;background:#54c7b1;color:#071c23;font-weight:700}.secondary{border:1px solid #5e829f;background:#172c42;color:#eaf3ff;border-radius:10px;padding:10px}.bar{background:#32465b;height:11px;border-radius:20px;overflow:hidden}.fill{height:100%;background:#65d6be;width:0}.note{padding:14px;border-left:3px solid #7fcac0;background:#1a3043;border-radius:7px;margin:15px 0;white-space:pre-wrap}textarea{width:100%;min-height:130px;border:1px solid #58748b;background:#091a2d;color:white;border-radius:9px;padding:12px}ul{line-height:1.8}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.feedback{min-height:25px;font-weight:650;margin:13px 0}.success{color:#98e6ba}.error{color:#ffb6b0}footer{margin:30px 0;color:#9bb3c8;font-size:13px}@media(max-width:740px){main{padding:13px}.layout{grid-template-columns:1fr}.hero,.card{padding:16px}.choice{min-height:48px}}
</style></head><body><nav aria-label="追加学習メニュー" style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:11px;margin:8px auto;background:#203951;border:1px solid #48647a;border-radius:12px;max-width:1080px"><a href="./questions.html" style="color:#9fe6d7;font-weight:700;padding:7px">質問ノート</a><a href="./knowledge.html" style="color:#9fe6d7;font-weight:700;padding:7px">知識ライブラリ</a></nav><main><nav class="nav"><a href="./index.html">← 20ステップ入門へ戻る</a><strong>AI研究ラボ / 体系コース</strong></nav><section class="hero"><span class="tag">研究者になるための基礎練習</span><h1>理解する → 試す → 記録する</h1><p class="muted">1日15分から。専門用語は例から学び、問題に答え、自分の言葉で説明する。正解だけでは「理解した」と判定しません。</p><div class="bar"><div class="fill" id="bar"></div></div><p id="progress" aria-live="polite"></p></section><div class="layout"><aside class="card"><h2>学習コース</h2><div id="nav"></div></aside><section class="card" id="lesson"><span class="tag" id="topic"></span><h2 id="title"></h2><p id="explain" style="line-height:1.9"></p><div class="note" id="example"></div><h3>確認テスト</h3><p id="question"></p><div id="answers"></div><p id="feedback" class="feedback" aria-live="polite"></p><h3>自分の言葉で説明する</h3><p class="muted">ここは自動採点ではありません。答えと照らし合わせて自分で説明できたかをチェック。</p><textarea id="reflection" placeholder="例：過学習とは、練習問題だけできて初見の問題が解けない状態。"></textarea><p class="row"><button class="secondary" id="save">ノートを保存</button><button class="primary" id="complete">この単元を完了する</button></p><p class="row"><button class="secondary" id="export">Obsidian用ノートを書き出す（.md）</button><button class="secondary" id="backup">進捗をバックアップ</button><label class="secondary">バックアップを復元<input type="file" id="import" accept="application/json" style="max-width:170px"></label></p><p class="muted">注意：ブラウザ保存のため別端末とは自動同期しません。バックアップJSONで移行できます。</p></section></div><footer>研究データは公開可能な素材のみ使用。APIキーや会社・顧客情報を入力しないでください。</footer></main><script>
const units=[
["0. 研究の考え方","研究とは何か","研究は『問い→仮説→実験→結果→限界』を他人が検証できる形で残すこと。検索で見つけた知識を紹介するだけでは、新しい研究結果にはならない。","例：『曖昧な指示でAIの失敗が増えるか』を調べる。同じ課題で指示だけ変更し、結果を比較する。","研究として重要なのは？",["自分の感想をたくさん書く","条件と結果を記録し第三者が検証可能にする","AIが正しいと言えば信じる"],1,"実験条件と失敗例も残そう。"],
["0. 研究の考え方","仮説と反証","仮説は実験で間違いだと示せる予想。『AIはすごい』はあいまいだが『条件AよりBで正答率が高い』は確かめられる。","例：条件Aと条件Bを同じ20課題で比較する。結果が逆なら仮説は支持されない。","反証できる仮説は？",["明確な指示は曖昧な指示より失敗率が低い","AIは夢がある","最新AIは最高"],0,"予想と違う結果も発見になる。"],
["1. Python","変数と型","変数は値に名前をつけるもの。整数、文字列、真偽値などの型によって扱い方が違う。","score = 3\nname = '研究ラボ'\npassed = True","整数が入っているのは？",["name","score","passed"],1,"数値を文字として保存すると計算が変わる。"],
["1. Python","関数とテスト","関数は処理をまとめるもの。テストは予想した入力と出力が一致するかを自動確認する。AIが書いたコードもテストで確かめる。","def double(x):\n    return x * 2\n\nassert double(3) == 6","assertの用途は？",["入力を消去する","コードを速くする","結果が予想と一致するか調べる"],2,"テスト成功だけで全ケースの正しさは保証されない。"],
["2. 数学・統計","平均とばらつき","平均は全体の代表値。ただし平均が同じでも結果のばらつきは異なる。研究では平均だけで結論を出さない。","Aの正答数：8,8,8　B：4,8,12。平均は同じ8だがBのばらつきは大きい。","この例で正しいのは？",["平均だけ見ればAとBは同じ性能と断定できる","BのばらつきはAより大きい","Bは必ず優秀"],1,"失敗率と試行回数も記録しよう。"],
["2. 数学・統計","相関と因果","一緒に変化すること（相関）と、一方が他方を引き起こすこと（因果）は別。第三の要因に注意する。","例：AI利用時間が長い人ほど成績がよいとしても、元の経験が原因かもしれない。","相関から言えるのは？",["必ず原因が証明された","因果関係は追加検証が必要","どちらも無関係と確定"],1,"可能なら比較条件を揃える。"],
["3. 機械学習","学習と推論","学習はデータからモデルの数値を調整すること。推論は調整済みモデルで新しい入力に答えること。","例：過去のデータで分類モデルを学習し、新しいメールを分類する。","推論とは？",["新しい入力に対して予測する","必ずモデルを再学習する","パソコンを起動する"],0,"LLMに質問する行為は一般に推論。"],
["3. 機械学習","過学習","練習データへの適合が強すぎて、未知のデータに弱くなること。学習用と評価用のデータを分ける。","例：模試の答えを丸暗記して同じ問題だけ満点になる。","過学習の兆候は？",["未知のデータでも高得点","学習用だけ高得点で評価用は低得点","両方で同じ傾向"],1,"評価データの漏洩にも注意。"],
["4. LLM","トークンと文脈","LLMは文章をトークン単位で処理する。文脈（コンテキスト）に含まれる指示や資料が回答に影響する。","例：同じ質問でも前に渡した条件が異なると答えは変わることがある。","正しいのは？",["常に同じ出力になる","文脈は回答に影響しない","前に渡した情報が回答に影響しうる"],2,"出力の一貫性は実測する。"],
["4. LLM","評価データセット","評価には課題、期待する結果、採点方法が必要。都合のよい成功例だけを抜き出すと評価を誤る。","例：20問の固定課題で成功率を測り、モデル名・版・日時・設定を記録する。","妥当な評価は？",["1件成功したので最高と判断","成功・失敗を同じ基準で記録する","失敗例を削除する"],1,"評価課題を改善に使いすぎると過適合する。"],
["5. AI安全性","指示逸脱と失敗モード","AIはもっともらしい間違いを出したり、利用者の意図と異なる操作を提案する場合がある。失敗条件を整理することが研究の出発点。","例：コード修正でテストは通るが、要求されていない設定を変更してしまう。","調査対象として適切なのは？",["成功例のみ","誤動作した条件と再現手順","AIの自己申告のみ"],1,"危険な実験は隔離した練習環境で。"],
["5. AI安全性","比較実験と再現性","1回の出力は偶然かもしれない。比較する条件を明示し、複数回試し、設定や失敗も公開可能な範囲で記録する。","例：指示A/Bを同じ課題セットで比較し、複数試行の成功率を報告する。","必要な記録は？",["良い結果だけ","モデル名だけ","指示・設定・結果・試行回数"],2,"結果に一般化の限界を書こう。"],
["6. 研究実践","研究計画を作る","研究計画には問い、仮説、比較条件、測定指標、記録方法、倫理・安全の確認を含める。","例：問い=指示の曖昧さはコード修正失敗率を上げるか。指標=テスト合格率、不要変更率。","研究計画で不足すると困るものは？",["評価指標","タイトルの装飾","SNS用の宣伝文"],0,"実験前に評価基準を決める。"],
["6. 研究実践","研究レポートを公開する","結果だけでなく手法、データの扱い、比較対象、限界を書く。会社の非公開情報は持ち出さない。","構成：Abstract / Question / Method / Results / Limitations / Reproduction","再現性を高めるのは？",["コードと手順を公開可能な形で残す","測定条件を隠す","成功数だけを書く"],0,"分からなかったことも明記する。"]
];
const KEY='ai-research-lab-course-v2';let state={done:{},notes:{}};try{let saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved&&typeof saved==='object')state={done:saved.done||{},notes:saved.notes||{}}}catch(e){}let current=0,answered=false;const $=s=>document.querySelector(s);function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('端末への保存に失敗しました。バックアップを出してください。')}}function renderNav(){$('#nav').innerHTML='';units.forEach((u,i)=>{const b=document.createElement('button');b.className='item'+(i===current?' active':'');b.textContent=(state.done[i]?'✓ ':'○ ')+(i+1)+'. '+u[1];b.onclick=()=>show(i);$('#nav').append(b)});let n=Object.keys(state.done).filter(x=>state.done[x]).length;$('#progress').textContent=n+' / '+units.length+' 単元完了';$('#bar').style.width=(n/units.length*100)+'%'}function show(i){current=i;answered=false;const u=units[i];$('#topic').textContent=u[0]+' / '+(i+1)+' of '+units.length;$('#title').textContent=u[1];$('#explain').textContent=u[2];$('#example').textContent=u[3];$('#question').textContent=u[4];$('#answers').innerHTML='';u[5].forEach((a,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+a;b.onclick=()=>{answered=j===u[6];$('#feedback').textContent=answered?'正解。続けて自分の言葉で説明してください。':'まだ違います。解説を読み直して再挑戦。';$('#feedback').className='feedback '+(answered?'success':'error')};$('#answers').append(b)});$('#feedback').textContent='';$('#reflection').value=state.notes[i]||'';renderNav()}$('#save').onclick=()=>{state.notes[current]=$('#reflection').value;persist();$('#feedback').textContent='ノートを保存しました。'};$('#complete').onclick=()=>{if(!answered){$('#feedback').textContent='先に確認テストで正解してください。';return}if($('#reflection').value.trim().length<15){$('#feedback').textContent='自分の言葉で15文字以上の説明を書いてください。';return}state.notes[current]=$('#reflection').value;state.done[current]=true;persist();show(Math.min(current+1,units.length-1))};function download(name,txt,type){const b=new Blob([txt],{type:type||'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('#export').onclick=()=>{state.notes[current]=$('#reflection').value;persist();let u=units[current],txt='---\ntags: [ai-research, learning]\nstatus: '+(state.done[current]?'done':'learning')+'\n---\n# '+u[1]+'\n\n## 解説\n'+u[2]+'\n\n## 具体例\n'+u[3]+'\n\n## 自分の説明\n'+(state.notes[current]||'未記入')+'\n\n## 次の疑問\n- \n';download('研究ノート_'+(current+1)+'.md',txt)};$('#backup').onclick=()=>download('ai-research-lab-course-backup.json',JSON.stringify(state,null,2),'application/json');$('#import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!v||typeof v.done!=='object'||typeof v.notes!=='object'||Array.isArray(v.done)||Array.isArray(v.notes))throw Error();state=v;persist();show(current)}catch(err){alert('正しいバックアップJSONではありません')}e.target.value=''};show(0);
</script><script src="./version.js?v=3.2.0"></script></body></html>
